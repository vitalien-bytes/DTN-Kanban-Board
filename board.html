<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DTN SmartOps</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">DTN</div>
      <div class="title">SmartOps</div>
    </div>

    <input id="search" class="search" placeholder="Rechercher un client..." />

    <div class="actions">
      <button class="btn" id="btnAddCol">+ Colonne</button>
      <button class="btn" id="btnAddCard">+ Client</button>
      <span class="sep"></span>
      <button class="btn" id="btnExport">Export JSON</button>
      <label class="btn file">
        Import JSON <input type="file" id="fileImport" accept="application/json"/>
      </label>
      <span class="sep"></span>
      <button class="btn primary" id="btnLoadDrive">Charger Drive</button>
      <button class="btn primary" id="btnSaveDrive">Sauver Drive</button>
      <button class="btn" id="btnPlanning">Planning</button>
      <label class="btn file">
  Import PDF <input type="file" id="pdfImport" accept="application/pdf"/>
</label>

    </div>
  </header>

  <div class="status" id="status">Prêt.</div>

  <main>
    <div id="board" class="board"></div>
  </main>

  <!-- Modal Client -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Ajouter / Modifier un client</h3>
        <button class="icon" id="closeModal">✕</button>
      </div>

      <div class="grid">
        <label>Nom<input id="m_lastname"/></label>
        <label>Prénom<input id="m_firstname"/></label>
        <label>Téléphone<input id="m_tel"/></label>
        <label>Email
  <input id="m_email" type="email" placeholder="client@email.fr"/>
</label>
        <label>Adresse<input id="m_address"/></label>
       
        <label>Date d’intervention
  <input id="m_date" type="date"/>
</label>

        <label>Type d’intervention
          <select id="m_work">
            <option>Électricité</option>
            <option>Fibre / Telecom</option>
            <option>IRVE</option>
            <option>Photovoltaïque</option>
            <option>Dépannage</option>
             <option>Recherche de regard</option>
            <option>VRD / Génie civil</option>
            <option>Autre</option>
          </select>
        </label>
        <label>Statut (colonne)
          <select id="m_col"></select>
        </label>
        <label class="full">Note / Infos
          <textarea id="m_note" rows="4"></textarea>
        </label>
      </div>

      <div class="modal-foot">
        <button class="btn" id="btnCancel">Annuler</button>
        <button class="btn primary" id="btnSave">Enregistrer</button>
      </div>
    </div>
  </div>
<!-- Modal Planning -->
<div class="modal" id="planningModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Planning interventions</h3>
      <button class="icon" id="closePlanning">✕</button>
    </div>

    <div class="planning-bar">
      <button class="btn" id="plToday">Aujourd’hui</button>
      <button class="btn" id="plWeek">7 jours</button>
      <span class="sep"></span>
      <label class="pl-label">Filtrer :
        <select id="plFilter">
          <option value="all">Toutes</option>
          <option value="todo">À faire</option>
          <option value="doing">En cours</option>
          <option value="done">Terminé</option>
        </select>
      </label>
    </div>

    <div class="planning-list" id="planningList"></div>
  </div>
</div>

<script src="app.js"></script>
<script src="smartops-import-pdf.js?v=10"></script>
</body>
</html>
